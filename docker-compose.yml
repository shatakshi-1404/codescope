# CodeScope: full stack (database + API + web app).
#
#   docker compose up --build -d      ->  http://localhost:8080
#
# Works with NO setup: every setting below has a safe local default.
# To customize, edit .env. To deploy on a server, run ./deploy.sh (see README).
name: codescope

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codescope_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-codescope}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No published port: only the backend can reach the database.
    # (docker-compose.dev.yml publishes it for development.)

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-codescope}:${POSTGRES_PASSWORD:-codescope_dev_password}@postgres:5432/${POSTGRES_DB:-codescope}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-dev-only-secret-not-for-production-0123456789}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-30}
      MAX_REPO_MB: ${MAX_REPO_MB:-300}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    # No published port: the browser reaches the API through the frontend (nginx).

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # APP_BIND=127.0.0.1 -> only this computer. deploy.sh sets 0.0.0.0 when there is no domain.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Optional HTTPS with automatic certificates. Only starts with:  --profile https
  # (deploy.sh does this for you when you give it a domain name.)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:
