# Rate-limit the authentication endpoints only (login, register, refresh, reset).
# Requests whose key is empty are not limited.
map $uri $auth_limit_key {
    default        "";
    ~^/api/auth/   $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth:10m rate=30r/m;
limit_req_status 429;

# Behind a TLS proxy (Caddy, a cloud load balancer) use the real client address,
# otherwise every visitor would share one rate-limit bucket. Adjust to your network.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (no add_header inside locations, so these apply everywhere).
    # Add Strict-Transport-Security at your TLS terminator, not here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # The browser talks to /api on the same origin, so no CORS is involved.
    location /api/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # Vite fingerprints asset file names, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths serve index.html. Never cache the shell.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
