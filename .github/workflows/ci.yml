name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codescope
          POSTGRES_PASSWORD: codescope_ci
          POSTGRES_DB: codescope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codescope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://codescope:codescope_ci@localhost:5432/codescope
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create a production-style .env
        run: |
          cp .env.example .env
          sed -i "s/^APP_ENV=.*/APP_ENV=production/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
      - name: Build and start the full stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q "CodeScope"
          curl -fsS http://localhost:8080/dashboard | grep -q 'id="root"'     # SPA fallback
          curl -fsS http://localhost:8080/health
          curl -sI http://localhost:8080/ | grep -qi "content-security-policy"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@example.com","password":"Passw0rd123"}')
          test "$code" = "201"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me)
          test "$code" = "401"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Advisory until the first findings are cleaned up. Then remove continue-on-error.
      - run: pip install ruff && ruff check backend --select E9,F
        continue-on-error: true
